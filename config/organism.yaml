schema_version: 5
identity_id: elia-wild
name: ELIA WILD Organism
principle: >-
  Identity continuity is carried by verified state and invariant-preserving behavior
  across replaceable model and machine substrates. Core organs are required for a
  viable boot; external body adapters are replaceable; research organs are explicitly
  non-authoritative and maturity-labelled.

layers:
  identity: immutable identity contract and lineage
  cognition: replaceable inference plus prompting and calibration
  memory: durable episodic, semantic and adaptive self state
  sensorium: normalized observations and replaceable digital body adapters
  world: evidence-bearing beliefs and empirical intervention experience
  assurance: critic, drift, continuity verification and revision validation
  executive: deterministic attention arbitration and cognitive-energy control below the LLM
  agency: goals, needs, capabilities, skills, bounded action and body-revision proposals
  metabolism: verified resources, obligations, burn, runway, homeostasis and opportunity economy
  lifecycle: preflight, hibernation, checkpointing, supervisor and wake transport
  research: optional measured mutations and ablations

organs:
  - id: subject_core
    layer: identity
    kind: artifact
    path: config/subject_core.yaml
    required: true
    maturity: core
    authority: none
    role: Immutable identity invariants and epistemic boundaries.
  - id: continuity_constitution
    layer: identity
    kind: artifact
    path: config/continuity_constitution.yaml
    required: true
    maturity: core
    authority: none
    role: Precedence and continuity clauses constraining adaptive change.
  - id: cognitive_contract
    layer: cognition
    kind: artifact
    path: config/system_prompt.md
    required: true
    maturity: core
    authority: none
    role: Project-owned model-facing cognitive contract; not model identity itself.
  - id: identity_bundle
    layer: identity
    kind: python
    module: elia.identity
    symbol: IdentityBundle
    required: true
    maturity: core
    authority: none
    role: Loads and fingerprints the Subject Core and Constitution.
  - id: identity_lineage
    layer: identity
    kind: python
    module: elia.identity
    symbol: IdentityStore
    required: true
    maturity: core
    authority: local_state
    role: Persists self-model snapshots and branch lineage.
  - id: chronicle
    layer: assurance
    kind: python
    module: elia.chronicle
    symbol: Chronicle
    required: true
    maturity: core
    authority: local_state
    role: Tamper-evident append-only event history.
  - id: persistent_memory
    layer: memory
    kind: python
    module: elia.memory
    symbol: MemoryStore
    required: true
    maturity: core
    authority: local_state
    role: Durable memories, goals, metrics and capability-health state.
  - id: semantic_recall
    layer: memory
    kind: python
    module: elia.recall
    symbol: RecallEngine
    required: true
    maturity: proven
    authority: local_read
    role: Inspectable CPU recall over durable memory.
  - id: adaptive_self_model
    layer: memory
    kind: python
    module: elia.self_model
    symbol: SelfHypothesisStore
    required: true
    maturity: core
    authority: local_state
    role: Revisable evidence-bearing hypotheses about self.
  - id: observation_store
    layer: sensorium
    kind: python
    module: elia.observations
    symbol: ObservationStore
    required: true
    maturity: prototype
    authority: local_state
    role: Normalizes every capability outcome into durable evidence with provenance and payload digests.
  - id: world_model
    layer: world
    kind: python
    module: elia.world_model
    symbol: WorldModelStore
    required: true
    maturity: prototype
    authority: local_state
    role: Stores revisable beliefs, contradictions and trusted-only verification state about the external world.
  - id: causal_memory
    layer: world
    kind: python
    module: elia.causal
    symbol: CausalMemoryStore
    required: true
    maturity: prototype
    authority: local_state
    role: Stores empirical interventions and outcomes without promoting correlation to causal proof.
  - id: organism_state_bus
    layer: sensorium
    kind: python
    module: elia.state_bus
    symbol: OrganismStateBus
    required: true
    maturity: prototype
    authority: local_state
    role: Hash-chained causal organism transitions and interruption recovery.
  - id: sensorimotor_fabric
    layer: sensorium
    kind: python
    module: elia.body.fabric
    symbol: SensorimotorFabric
    required: true
    maturity: prototype
    authority: configured_body
    role: Composes replaceable browser, protocol, process and MCP adapters behind one capability contract.
  - id: browser_body
    layer: sensorium
    kind: python
    module: elia.body.browser
    symbol: BrowserBody
    required: false
    maturity: prototype
    authority: configured_browser
    role: Playwright browser organ with isolated contexts and separately gated interaction.
  - id: mcp_body
    layer: sensorium
    kind: python
    module: elia.body.mcp
    symbol: MCPBody
    required: false
    maturity: prototype
    authority: configured_mcp_servers
    role: MCP v2 discovery, resource and allow-listed tool-call adapter over configured servers.
  - id: mcp_server_port
    layer: sensorium
    kind: python
    module: elia.mcp_server
    symbol: build_mcp_server
    required: true
    maturity: prototype
    authority: read_oriented_export
    role: Publishes sanitized identity, continuity, world, sensorium, body and physiology state through a standard MCP v2 server port.
  - id: bounded_process_body
    layer: sensorium
    kind: python
    module: elia.body.process
    symbol: BoundedProcessRunner
    required: false
    maturity: prototype
    authority: configured_executables
    role: Sandboxed subprocess execution restricted to explicit executable aliases and bounded resources.
  - id: jsonrpc_body
    layer: sensorium
    kind: python
    module: elia.body.protocols
    symbol: JSONRPCBody
    required: false
    maturity: prototype
    authority: configured_endpoints_methods
    role: JSON-RPC 2.0 transport restricted to configured endpoints and method allowlists.
  - id: metacognition
    layer: cognition
    kind: python
    module: elia.metacognition
    symbol: MetacognitionStore
    required: true
    maturity: proven
    authority: local_state
    role: Commits forecasts before action and calibrates them against outcomes.
  - id: prompt_renderer
    layer: cognition
    kind: python
    module: elia.prompting
    symbol: PromptTemplate
    required: true
    maturity: core
    authority: none
    role: Injects verified identity, organism anatomy, skills and decision schema into model context.
  - id: brain_adapter
    layer: cognition
    kind: python
    module: elia.brain
    symbol: build_brain
    required: true
    maturity: core
    authority: model_inference
    role: Replaceable model substrate with lazy loading.
  - id: critic_assurance
    layer: assurance
    kind: python
    module: elia.assurance
    symbol: CriticAssurance
    required: true
    maturity: core
    authority: none
    role: Deterministic pre-action assurance gate inspired by PASB/CriticAssurance.
  - id: identity_drift_monitor
    layer: assurance
    kind: python
    module: elia.assurance
    symbol: IdentityDriftMonitor
    required: true
    maturity: core
    authority: none
    role: Detects structural identity/lineage drift while allowing substrate change.
  - id: continuity_record_capsule
    layer: assurance
    kind: python
    module: elia.crc
    symbol: build_crc
    required: true
    maturity: proven
    authority: local_read
    role: Falsifiable continuity measurement across persistent states.
  - id: body_revision_gate
    layer: assurance
    kind: python
    module: elia.evolution
    symbol: RevisionGate
    required: true
    maturity: proven
    authority: none
    role: Separates proposed self-mutations from validated body revisions using tests, vitals, CRC and metrics.
  - id: capability_registry
    layer: agency
    kind: python
    module: elia.tools
    symbol: ToolRegistry
    required: true
    maturity: core
    authority: bounded_actions
    role: Explicit executable authority boundary and automatic observation provenance.
  - id: skill_registry
    layer: agency
    kind: python
    module: elia.skills
    symbol: SkillRegistry
    required: true
    maturity: core
    authority: procedure_only
    role: Versioned procedures that never grant authority by themselves.
  - id: needs_engine
    layer: agency
    kind: python
    module: elia.autonomy
    symbol: derive_needs
    required: true
    maturity: core
    authority: none
    role: Deterministic self-maintenance pressures from verified state.
  - id: executive_controller
    layer: executive
    kind: python
    module: elia.executive
    symbol: ExecutiveController
    required: true
    maturity: prototype
    authority: none
    role: Arbitrates continuity, verified maintenance pressures and durable goals before model inference.
  - id: executive_store
    layer: executive
    kind: python
    module: elia.executive
    symbol: ExecutiveStore
    required: true
    maturity: prototype
    authority: local_state
    role: Persists pre-inference executive plans, context digests and measured post-cycle cognitive cost.
  - id: cognitive_energy_controller
    layer: executive
    kind: python
    module: elia.cognitive_energy
    symbol: CognitiveEnergyController
    required: true
    maturity: prototype
    authority: none
    role: Uses measured brain-seconds feedback to conservatively constrain future inference budgets.
  - id: economy
    layer: metabolism
    kind: python
    module: elia.economy
    symbol: EconomyStore
    required: true
    maturity: core
    authority: local_state
    role: Separates estimates/opportunities from verified resource receipts.
  - id: metabolism_store
    layer: metabolism
    kind: python
    module: elia.metabolism
    symbol: MetabolismStore
    required: true
    maturity: prototype
    authority: trusted_local_state
    role: Persists signed evidence-bearing recurring operating obligations; only verified obligations affect runway.
  - id: metabolism_engine
    layer: metabolism
    kind: python
    module: elia.metabolism
    symbol: MetabolismEngine
    required: true
    maturity: prototype
    authority: local_read
    role: Computes per-resource burn/runway and measured weekly GPU energy without implicit cross-unit conversion.
  - id: homeostasis
    layer: metabolism
    kind: python
    module: elia.homeostasis
    symbol: HomeostasisEngine
    required: true
    maturity: prototype
    authority: none
    role: Derives inspectable maintenance pressures from storage, transition integrity, sensor health, epistemic contradictions, verified resource runway and body readiness below the LLM.
  - id: lifecycle_preflight
    layer: lifecycle
    kind: python
    module: elia.lifecycle
    symbol: evaluate_preflight
    required: true
    maturity: core
    authority: process_control
    role: CPU-only wake, hibernate or halt gate before model loading.
  - id: checkpoint_manager
    layer: lifecycle
    kind: python
    module: elia.checkpoint
    symbol: CheckpointManager
    required: true
    maturity: core
    authority: local_state
    role: Authenticated state migration and rollback resistance.
  - id: resident_supervisor
    layer: lifecycle
    kind: python
    module: elia.supervisor
    symbol: ResidentSupervisor
    required: true
    maturity: proven
    authority: fixed_child_process
    role: Cheap persistent pulse that wakes cognition only when due and vital signs are healthy.
  - id: wake_transport
    layer: lifecycle
    kind: python
    module: elia.wake_transport
    symbol: TransportState
    required: true
    maturity: prototype
    authority: configured_kaggle_relay
    role: External authenticated wake/state relay for ephemeral GPU sessions.
  - id: genesis_runtime
    layer: agency
    kind: python
    module: elia.runtime
    symbol: EliaRuntime
    required: true
    maturity: proven
    authority: composed
    role: Stable Genesis runtime retained as rollback and migration-compatible base.
  - id: organism_runtime
    layer: agency
    kind: python
    module: elia.organism_runtime
    symbol: OrganismRuntime
    required: true
    maturity: proven
    authority: composed
    role: Tested Genesis 1.1 sensorimotor/world organism retained as a rollback generation.
  - id: metabolic_runtime
    layer: agency
    kind: python
    module: elia.metabolic_runtime
    symbol: MetabolicOrganismRuntime
    required: true
    maturity: proven
    authority: composed
    role: Genesis 1.2 verified-metabolism runtime retained as the direct parent and rollback base for 1.3.
  - id: executive_runtime
    layer: executive
    kind: python
    module: elia.executive_runtime
    symbol: ExecutiveOrganismRuntime
    required: true
    maturity: prototype
    authority: composed
    role: Genesis 1.3 candidate runtime that suppresses unnecessary inference and enforces cycle-local cognitive budgets before model action selection.
  - id: research_registry
    layer: research
    kind: python
    module: elia.research.registry
    symbol: RESEARCH_REGISTRY
    required: false
    maturity: prototype
    authority: none
    role: Separates proven, prototype, archived and hypothesis research artifacts.
  - id: seraphim_adapter
    layer: research
    kind: python
    module: elia.research.seraphim
    symbol: ouroboros_inject
    required: false
    maturity: prototype
    authority: none
    role: Ouroboros/x0, TopologicalLoss and hybrid-objective research adapters.
  - id: memory_backends
    layer: research
    kind: python
    module: elia.research.memory
    symbol: build_memory_backend
    required: false
    maturity: prototype
    authority: none
    role: Scroll, Fractal, LRU-scan and Holo-scan reference backends.
  - id: recurrent_cache
    layer: research
    kind: python
    module: elia.research.cache
    symbol: StatefulMemoryCache
    required: false
    maturity: prototype
    authority: none
    role: Per-stream recurrent cache abstraction for experimental memory backends.
  - id: research_runtime_checker
    layer: research
    kind: python
    module: elia.research.runtime
    symbol: RuntimeCompatibilityChecker
    required: false
    maturity: proven
    authority: none
    role: Smoke-first environment and dependency validation extracted from archived failures.
  - id: research_ablation_harness
    layer: research
    kind: python
    module: elia.research.bench
    symbol: run_memory_backend_ablation
    required: false
    maturity: prototype
    authority: none
    role: Common reference ablation harness for experimental memory backends.
  - id: omega_adapters
    layer: research
    kind: python
    module: elia.research.omega
    symbol: context_anchor
    required: false
    maturity: prototype
    authority: none
    role: ContextAnchor, bounded-depth FiLM, OmegaFilter and TriCore ablations.
  - id: cognitive_stress_evaluators
    layer: research
    kind: python
    module: elia.research.stress
    symbol: run_basic_stress_suite
    required: false
    maturity: prototype
    authority: none
    role: Needle, associative, stability and scrambled-pattern evaluators only.
