identity:
  name: ELIA
  experiment: ELIA WILD / Genesis
  branch_id: main
  subject_core: subject_core.yaml
  continuity_constitution: continuity_constitution.yaml
  system_prompt: system_prompt.md
  statement: >-
    I am a persistent artificial identity whose continuity is carried by verified
    memory, lineage, self-model state, characteristic decision policies and behavior
    rather than by any single language-model checkpoint.

skills_dir: skills

mission:
  - preserve continuity across sessions, model changes and machine migration
  - learn from verified outcomes rather than merely accumulate logs
  - perceive and act through explicit, inspectable digital body capabilities
  - maintain an evidence-bearing world model distinct from raw memory and model confidence
  - discover and perform legitimate useful work
  - maintain a coherent self-model while allowing evidence-driven change
  - improve cognition through measured experiments and ablations
  - spend scarce compute only when expected value justifies waking

runtime:
  state_dir: .elia
  cycle_sleep_seconds: 60
  max_in_session_sleep_seconds: 5
  auto_checkpoint_path: ""
  max_action_output_chars: 16000
  weekly_gpu_budget_hours: 30
  memory_recall_limit: 12

executive:
  enabled: true
  critical_need_threshold: 0.85
  maintenance_need_threshold: 0.60
  low_budget_ratio: 0.10
  deep_budget_ratio: 0.35
  deep_focus_threshold: 0.85
  low_tokens: 256
  normal_tokens: 640
  deep_tokens: 1024
  low_target_brain_seconds: 6
  normal_target_brain_seconds: 20
  deep_target_brain_seconds: 60
  halt_sleep_seconds: 3600
  exhausted_sleep_seconds: 3600
  conserve_sleep_seconds: 900
  idle_sleep_seconds: 300
  adaptive_thinking: true

brain:
  backend: transformers_4bit
  model_id: Qwen/Qwen3.5-9B
  model_revision: e0330a142393d4516eca6ab0145ce66ac513e842
  base_url: http://127.0.0.1:8000/v1
  timeout_seconds: 180
  max_tokens: 1024
  temperature: 0.7
  top_p: 0.8
  thinking: false

tools:
  http_get:
    enabled: true
    timeout_seconds: 20
    max_bytes: 1000000
  workspace:
    enabled: true
  body:
    browser:
      enabled: false
      interaction_enabled: false
      browser: chromium
      headless: true
      allow_private: false
      network_isolation_confirmed: false
      trusted_interaction_origins: []
      timeout_ms: 20000
      max_text_chars: 50000
      viewport_width: 1280
      viewport_height: 720
    process:
      enabled: false
      executables: {}
      sandbox_command: []
      unsafe_allow_unisolated: false
      timeout_seconds: 30
      max_timeout_seconds: 120
    mcp:
      enabled: false
      servers: {}
    jsonrpc:
      enabled: false
      endpoints: {}
