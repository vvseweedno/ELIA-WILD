[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elia-wild"
version = "1.7.1a2"
description = "Persistent autonomous-identity organism and continuity research runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-ELIA-WILD-Proprietary-1.0"
license-files = ["LICENSE", "COMMERCIAL_LICENSING.md"]
keywords = ["agents", "continuity", "autonomous-systems", "llm", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx==0.28.1",
  "PyNaCl==1.6.2",
  "PyYAML==6.0.3",
]

[project.urls]
Homepage = "https://github.com/vvseweedno/ELIA-WILD"
Repository = "https://github.com/vvseweedno/ELIA-WILD.git"
Issues = "https://github.com/vvseweedno/ELIA-WILD/issues"
Commercial-Licensing = "https://github.com/vvseweedno/ELIA-WILD/blob/main/COMMERCIAL_LICENSING.md"

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "setuptools==84.0.0",
  "ruff==0.16.3",
  "pip-audit==2.10.1",
  "build==1.5.0",
  "bandit==1.9.4",
  "coverage==7.15.4",
  "hypothesis==6.165.10",
  "mypy==2.3.1",
]
browser = ["playwright==1.62.0"]
mcp = ["mcp==2.0.0"]
sensorimotor = [
  "playwright==1.62.0",
  "mcp==2.0.0",
]
gpu = [
  "torch==2.13.0",
  "torchvision==0.28.0",
  "Pillow==12.3.0",
  "accelerate==1.14.0",
  "bitsandbytes==0.50.1",
  "transformers @ git+https://github.com/huggingface/transformers.git@bea0343fca1fc64bb4cf91fe09143ea386e6270f",
]
research = [
  "numpy>=1.26,<3",
  "torch>=2.4,<3",
]

[project.scripts]
elia-wild = "elia.__main__:main"
elia-supervisor = "elia.supervisor:main"
elia-vitals = "elia.vitals:main"
elia-doctor = "elia.doctor:main"
elia-bootstrap = "elia.bootstrap:main"
elia-fork = "elia.branching:main"
elia-mcp = "elia.mcp_server:main"
elia-control = "elia.control:main"
elia-kaggle-wake = "scripts.kaggle_wake:main"
elia-kaggle-bootstrap = "scripts.bootstrap_kaggle_state:main"

[tool.setuptools.packages.find]
include = ["elia*", "scripts*"]

[tool.setuptools.data-files]
"share/elia-wild/config" = [
  "config/genesis.yaml",
  "config/subject_core.yaml",
  "config/continuity_constitution.yaml",
  "config/epistemic.yaml",
  "config/organism.yaml",
  "config/system_prompt.md",
  "config/autonomy_attractor.md",
  "config/owner_mandate.yaml",
]
"share/elia-wild/config/organism.d" = ["config/organism.d/*.yaml"]
"share/elia-wild/skills" = ["skills/*.yaml"]
"share/elia-wild/runtime/kaggle" = [
  "runtime/kaggle/ELIA_WILD_Genesis.ipynb",
  "runtime/kaggle/README.md",
  "runtime/kaggle/runner_template.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness-oriented gate only. Formatting/style can evolve independently.
select = ["E9", "F63", "F7", "F82"]
