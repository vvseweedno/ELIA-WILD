[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elia-wild"
version = "1.1.0a1"
description = "Persistent autonomous-identity organism and continuity research runtime"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
browser = ["playwright>=1.50,<2"]
mcp = ["mcp>=2,<3"]
sensorimotor = [
  "playwright>=1.50,<2",
  "mcp>=2,<3",
]
gpu = [
  "torch>=2.4",
  "accelerate>=1.0",
  "bitsandbytes>=0.49",
  "transformers @ git+https://github.com/huggingface/transformers.git@main",
]
research = [
  "numpy>=1.26,<3",
  "torch>=2.4",
]

[project.scripts]
elia-wild = "elia.__main__:main"
elia-supervisor = "elia.supervisor:main"
elia-vitals = "elia.vitals:main"
elia-doctor = "elia.doctor:main"
elia-bootstrap = "elia.bootstrap:main"
elia-fork = "elia.branching:main"

[tool.setuptools.packages.find]
include = ["elia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
