[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elia-wild"
version = "1.3.0a1"
description = "Persistent autonomous-identity organism and continuity research runtime"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "setuptools==83.0.0",
  "ruff==0.16.3",
  "pip-audit==2.10.1",
]
browser = ["playwright==1.62.0"]
mcp = ["mcp==2.0.0"]
sensorimotor = [
  "playwright==1.62.0",
  "mcp==2.0.0",
]
gpu = [
  "torch>=2.4,<3",
  "accelerate>=1.0,<2",
  "bitsandbytes>=0.49,<0.50",
  "transformers @ git+https://github.com/huggingface/transformers.git@bea0343fca1fc64bb4cf91fe09143ea386e6270f",
]
research = [
  "numpy>=1.26,<3",
  "torch>=2.4,<3",
]

[project.scripts]
elia-wild = "elia.__main__:main"
elia-supervisor = "elia.supervisor:main"
elia-vitals = "elia.vitals:main"
elia-doctor = "elia.doctor:main"
elia-bootstrap = "elia.bootstrap:main"
elia-fork = "elia.branching:main"
elia-mcp = "elia.mcp_server:main"

[tool.setuptools.packages.find]
include = ["elia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness-oriented gate only. Formatting/style can evolve independently.
select = ["E9", "F63", "F7", "F82"]
