[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elia-wild"
version = "0.1.0"
description = "Persistent autonomous-identity runtime experiment"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
elia-wild = "elia.__main__:main"

[tool.setuptools.packages.find]
include = ["elia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
