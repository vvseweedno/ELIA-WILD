name: Genesis CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Static correctness gates
        run: |
          python -m pip check
          python -m compileall -q elia tests
          ruff check elia tests
      - name: Known-vulnerability audit
        run: python -m pip_audit
      - name: Test
        run: pytest -q --junitxml=pytest-report.xml
      - name: ELIA AgentBench autonomy falsification gate
        run: python -m elia.agentbench --json
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
      - name: Zero-GPU bootstrap and doctor
        run: |
          ELIA_STATE_DIR=.elia-bootstrap elia-bootstrap --cycles 2
          ELIA_STATE_DIR=.elia-doctor elia-doctor
      - name: Smoke runtime + vital signs + resident supervisor
        run: |
          ELIA_STATE_DIR=.elia-smoke ELIA_BRAIN=mock python -m elia --cycles 3
          ELIA_STATE_DIR=.elia-smoke python -m elia --verify
          ELIA_STATE_DIR=.elia-smoke python -m elia --vitals
          ELIA_STATE_DIR=.elia-smoke python -m elia --status
          ELIA_STATE_DIR=.elia-smoke elia-supervisor --dry-run
      - name: Reference research smoke
        run: |
          python -c "from elia.research.bench import run_reference_cognitive_stress as r; x=r(); assert x['needle']==1.0 and x['scrambled_pattern']==1.0 and all(i['finite'] for i in x['memory_backends'])"

  sensorimotor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install sensorimotor dependencies
        run: python -m pip install -e '.[test,sensorimotor]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Known-vulnerability audit
        run: python -m pip_audit
      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Sensorimotor integration tests
        run: |
          pytest -q \
            tests/test_asyncio_bridge_v1.py \
            tests/test_process_body_v1.py \
            tests/test_jsonrpc_body_v1.py \
            tests/test_mcp_body_v1.py \
            tests/test_mcp_server_v1.py \
            tests/test_browser_body_v1.py \
            tests/test_sensorium_v1.py \
            tests/test_world_model_v1.py \
            tests/test_state_bus_v1.py \
            tests/test_organism_runtime_v1.py \
            tests/test_homeostasis_v1.py \
            tests/test_resource_ecology_v1.py \
            tests/test_resource_runtime_v1.py \
            tests/test_resource_ingress_v1.py \
            tests/test_resource_ingress_attestation_v1.py \
            tests/test_work_ports_v1.py \
            tests/test_organism_overlays_v1.py \
            tests/test_action_log_redaction_v1.py \
            tests/test_provider_context_security_v1.py \
            tests/test_persistence_redaction_v1.py \
            tests/test_integrity_hardening_v1.py \
            tests/test_subprocess_secret_scope_v1.py \
            --junitxml=sensorimotor-report.xml
      - name: Upload sensorimotor report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sensorimotor-report
          path: sensorimotor-report.xml
          if-no-files-found: ignore

  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Build wheel and sdist
        run: |
          python -m pip install build==1.5.0
          python -m build
      - name: Capture checkout fingerprints
        run: |
          python -m pip install .
          ELIA_STATE_DIR=/tmp/elia-checkout-state elia-doctor > /tmp/checkout-doctor.json
      - name: Test clean wheel install outside checkout
        run: |
          python -m venv /tmp/elia-wheel-env
          /tmp/elia-wheel-env/bin/python -m pip install dist/*.whl
          mkdir -p /tmp/elia-wheel-run
          cd /tmp/elia-wheel-run
          ELIA_STATE_DIR=/tmp/elia-wheel-state /tmp/elia-wheel-env/bin/elia-doctor > /tmp/wheel-doctor.json
          ELIA_STATE_DIR=/tmp/elia-wheel-state /tmp/elia-wheel-env/bin/elia-bootstrap --cycles 1
          ELIA_STATE_DIR=/tmp/elia-wheel-state /tmp/elia-wheel-env/bin/elia-vitals
          ELIA_STATE_DIR=/tmp/elia-wheel-state /tmp/elia-wheel-env/bin/elia-wild --status
          ELIA_STATE_DIR=/tmp/elia-wheel-state /tmp/elia-wheel-env/bin/elia-supervisor --dry-run
      - name: Test clean sdist install outside checkout
        run: |
          python -m venv /tmp/elia-sdist-env
          /tmp/elia-sdist-env/bin/python -m pip install dist/*.tar.gz
          mkdir -p /tmp/elia-sdist-run
          cd /tmp/elia-sdist-run
          ELIA_STATE_DIR=/tmp/elia-sdist-state /tmp/elia-sdist-env/bin/elia-doctor > /tmp/sdist-doctor.json
          ELIA_STATE_DIR=/tmp/elia-sdist-state /tmp/elia-sdist-env/bin/elia-bootstrap --cycles 1
          ELIA_STATE_DIR=/tmp/elia-sdist-state /tmp/elia-sdist-env/bin/elia-vitals
          ELIA_STATE_DIR=/tmp/elia-sdist-state /tmp/elia-sdist-env/bin/elia-wild --status
          ELIA_STATE_DIR=/tmp/elia-sdist-state /tmp/elia-sdist-env/bin/elia-supervisor --dry-run
      - name: Compare canonical fingerprints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = {
              name: json.loads(Path(path).read_text())
              for name, path in {
                  'checkout': '/tmp/checkout-doctor.json',
                  'wheel': '/tmp/wheel-doctor.json',
                  'sdist': '/tmp/sdist-doctor.json',
              }.items()
          }
          expected_identity = reports['checkout']['identity']['fingerprint']
          expected_manifest = reports['checkout']['organism']['manifest_fingerprint']
          for name, report in reports.items():
              assert report['healthy'] is True, (name, report)
              assert report['identity']['fingerprint'] == expected_identity, name
              assert report['organism']['manifest_fingerprint'] == expected_manifest, name
          PY
      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
