name: Retire Superseded Branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-branches.yml

permissions:
  contents: write

concurrency:
  group: elia-wild-branch-retirement
  cancel-in-progress: false

jobs:
  retire:
    if: ${{ github.repository == 'vvseweedno/ELIA-WILD' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify manifest and retire superseded refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from typing import Any
          from urllib.error import HTTPError
          from urllib.parse import quote, urlencode
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          if repository != "vvseweedno/ELIA-WILD":
              raise RuntimeError(f"unexpected repository: {repository!r}")

          expected = {
              "audit/whole-organism-2026-08-18": "27ad27d07d2374cf59fab9dbd207d90d74ac43da",
              "elia/continuity-kernel-hardening-v1": "8494c92197e612baf03ca3b9672ffd3a18efc39f",
              "elia/epistemic-ecosystem-v1": "aa5c37a6a6b10ce628e015291efbfc3db2755da2",
              "elia/executive-cortex-v1": "c618d00b12d0b81316e5c133e617bd07291d590c",
              "elia/external-work-ports-v1": "6951ffff5925d8aa716b8062dfc90f45222189a7",
              "elia/genesis-1.7.1-consolidation": "31260d9f07a9756003cece8862ea5b0c3a9e46f4",
              "elia/metabolism-runway-v1": "268e82daa618ac2edcdaeea833dabd6eafe8827f",
              "elia/repository-architecture-v1": "d56be8837d77a6a2150bb17042606cda3c1e8c8f",
              "elia/repository-architecture-v2": "214f7fa82528d80c799e8285e6d4cadd15523dd1",
              "elia/resource-ecology-v1": "2dfdd014cd9757fa668ad8f4cf9bc956980cab84",
              "elia/resource-ingress-v1": "832413f5c8d7289a2478f17101ef80088be65c87",
              "elia/sensorimotor-worldmodel-v1": "039eabb86777457c50a949bf13e1fd91e8135850",
          }

          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "ELIA-WILD-branch-retirement",
              "X-GitHub-Api-Version": "2022-11-28",
          }


          def api(method: str, path: str) -> Any:
              request = Request(api_root + path, headers=headers, method=method)
              try:
                  with urlopen(request, timeout=30) as response:
                      payload = response.read()
              except HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"GitHub API {method} {path} failed: {error.code} {detail}"
                  ) from error
              return json.loads(payload) if payload else None


          def branch_tips() -> dict[str, str]:
              result: dict[str, str] = {}
              page = 1
              while True:
                  query = urlencode({"per_page": 100, "page": page})
                  batch = api("GET", f"/branches?{query}")
                  if not isinstance(batch, list):
                      raise RuntimeError("branch inventory response is not a list")
                  for item in batch:
                      name = item.get("name")
                      commit = item.get("commit")
                      sha = commit.get("sha") if isinstance(commit, dict) else None
                      if not isinstance(name, str) or not isinstance(sha, str):
                          raise RuntimeError("branch inventory contains an invalid item")
                      if name in result:
                          raise RuntimeError(f"duplicate branch in inventory: {name!r}")
                      result[name] = sha
                  if len(batch) < 100:
                      return result
                  page += 1


          before = branch_tips()
          allowed = {"main", *expected}
          if set(before) != allowed:
              raise RuntimeError(
                  "branch set differs from the audited manifest: "
                  f"expected={sorted(allowed)!r}, actual={sorted(before)!r}"
              )
          if before["main"] != os.environ["GITHUB_SHA"]:
              raise RuntimeError("workflow is not running from the current main tip")
          mismatches = {
              branch: {"expected": sha, "actual": before.get(branch)}
              for branch, sha in expected.items()
              if before.get(branch) != sha
          }
          if mismatches:
              raise RuntimeError(f"branch tips changed after audit: {mismatches!r}")

          for branch in sorted(expected):
              ref = quote(f"heads/{branch}", safe="/")
              api("DELETE", f"/git/refs/{ref}")
              print(f"retired {branch} at {expected[branch]}")

          after = branch_tips()
          if after != {"main": os.environ["GITHUB_SHA"]}:
              raise RuntimeError(f"unexpected post-retirement branch set: {after!r}")
          print("verified: main is the sole remaining branch")
          PY
